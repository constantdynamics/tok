name: Web CI

on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Node 20 instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependencies installeren
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit-tests
        run: npm test
